<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stretch Test</title>
<style>
  body{ font-family: sans-serif; background:#111; color:#eee; padding:20px; }
  button{ padding:14px 20px; font-size:16px; margin:8px 0; width:100%; }
  #log{ white-space:pre-wrap; background:#000; color:#0f0; padding:12px; border-radius:8px; font-size:13px; margin-top:16px; min-height:200px; }
  audio{ width:100%; margin-top:12px; }
</style>
</head>
<body>

<h2>Vocal Stretch Isolation Test</h2>
<p>This makes a short beep tone (no TTS needed), then tries to time-stretch it using the library — same technique the real app uses, just isolated so we can see exactly what happens.</p>

<button onclick="runTest()">Run Test</button>

<div id="log">Waiting to run...</div>
<div id="playback"></div>

<script>
function log(msg){
  document.getElementById('log').textContent += "\n" + msg;
  console.log(msg);
}

// Makes a simple 1-second beep tone as a stand-in for a real vocal clip,
// so this test doesn't depend on your TTS server at all — purely isolates
// the stretch library itself.
function makeTestTone(){
  const sampleRate = 44100;
  const duration = 1;
  const buffer = new AudioContext().createBuffer(1, sampleRate * duration, sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < data.length; i++){
    data[i] = Math.sin(2 * Math.PI * 440 * i / sampleRate) * 0.5;
  }
  return buffer;
}

async function runTest(){
  document.getElementById('log').textContent = "Starting...";
  try {
    const { default: SignalsmithStretch } = await import('https://esm.sh/signalsmith-stretch@1');
    log("✓ Library imported OK");

    const testBuffer = makeTestTone();
    log("✓ Test tone created: " + testBuffer.duration.toFixed(2) + "s, " + testBuffer.numberOfChannels + " channel(s)");

    const targetSeconds = testBuffer.duration * 2; // stretch to double length
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // ---- ATTEMPT 1: setState/getState (per official docs) on a LIVE AudioContext ----
    log("\n--- Attempt 1: setState/getState API, live AudioContext ---");
    try {
      const stretch1 = await SignalsmithStretch(audioCtx, { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
      const members1 = Object.getOwnPropertyNames(Object.getPrototypeOf(stretch1)).concat(Object.keys(stretch1));
      log("Node members available: " + members1.join(", "));
      log("Has setState? " + (typeof stretch1.setState === "function"));
      log("Has addBuffers? " + (typeof stretch1.addBuffers === "function"));

      if (typeof stretch1.setState === "function") {
        await stretch1.setState({
          sample: {
            buffers: [testBuffer.getChannelData(0)],
            sampleRate: testBuffer.sampleRate,
            speed: 0.5,
            position: 0,
            endPosition: testBuffer.duration,
            playing: 1
          }
        });
        log("✓ setState() call completed without throwing");
        const state = await stretch1.getState();
        log("getState() returned: " + JSON.stringify(state));
      } else if (typeof stretch1.addBuffers === "function") {
        log("setState not available — using addBuffers/schedule instead (confirmed real API)");
        await stretch1.addBuffers([testBuffer.getChannelData(0)]);
        log("✓ addBuffers() completed");
        stretch1.start();
        log("✓ start() called");
        stretch1.schedule({ input: 0, output: audioCtx.currentTime + 0.15, rate: 0.5 });
        log("✓ schedule() called with output = currentTime + 0.15");
      } else {
        log("✗ Neither setState nor addBuffers available — cannot proceed");
      }

      // Record real-time output via MediaStreamDestination so we can hear
      // exactly what this produces, on a live context (matches every real
      // example/demo of this library — none of them use OfflineAudioContext).
      const dest = audioCtx.createMediaStreamDestination();
      stretch1.connect(dest);
      const recorder = new MediaRecorder(dest.stream);
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);

      const recordingDone = new Promise(resolve => {
        recorder.onstop = () => resolve(new Blob(chunks, { type: 'audio/webm' }));
      });

      recorder.start();
      log("Recording live output for " + targetSeconds.toFixed(2) + "s...");
      await new Promise(r => setTimeout(r, targetSeconds * 1000 + 300));
      recorder.stop();
      const blob = await recordingDone;
      log("✓ Recorded blob size: " + blob.size + " bytes");

      const url = URL.createObjectURL(blob);
      const audioEl = document.createElement('audio');
      audioEl.controls = true;
      audioEl.src = url;
      document.getElementById('playback').innerHTML = "<p><b>Attempt 1 result (setState, live context):</b></p>";
      document.getElementById('playback').appendChild(audioEl);

    } catch (e) {
      log("✗ Attempt 1 failed: " + e.message);
    }

    // ---- ATTEMPT 2: same addBuffers/schedule API, but schedule() BEFORE start() ----
    // Testing both orderings in one run since I don't have a way to verify
    // which is correct without actually seeing real output.
    log("\n--- Attempt 2: schedule() BEFORE start() ---");
    try {
      const stretch2 = await SignalsmithStretch(audioCtx, { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
      await stretch2.addBuffers([testBuffer.getChannelData(0)]);
      log("✓ addBuffers() completed");
      stretch2.schedule({ input: 0, output: audioCtx.currentTime + 0.15, rate: 0.5 });
      log("✓ schedule() called first");
      stretch2.start();
      log("✓ start() called second");

      const dest2 = audioCtx.createMediaStreamDestination();
      stretch2.connect(dest2);
      const recorder2 = new MediaRecorder(dest2.stream);
      const chunks2 = [];
      recorder2.ondataavailable = e => chunks2.push(e.data);
      const recordingDone2 = new Promise(resolve => {
        recorder2.onstop = () => resolve(new Blob(chunks2, { type: 'audio/webm' }));
      });
      recorder2.start();
      log("Recording live output for " + targetSeconds.toFixed(2) + "s...");
      await new Promise(r => setTimeout(r, targetSeconds * 1000 + 300));
      recorder2.stop();
      const blob2 = await recordingDone2;
      log("✓ Recorded blob size: " + blob2.size + " bytes");

      const url2 = URL.createObjectURL(blob2);
      const audioEl2 = document.createElement('audio');
      audioEl2.controls = true;
      audioEl2.src = url2;
      const label2 = document.createElement('p');
      label2.innerHTML = "<b>Attempt 2 result (schedule before start):</b>";
      document.getElementById('playback').appendChild(label2);
      document.getElementById('playback').appendChild(audioEl2);

    } catch (e) {
      log("✗ Attempt 2 failed: " + e.message);
    }

  } catch (e) {
    log("✗ FATAL: " + e.message);
  }
}
</script>

</body>
</html>
